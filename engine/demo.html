<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>sprite demo</title>
<link rel="stylesheet" href="css/sprite.css">
<style>body{background:#171226;display:flex;gap:2rem;padding:2rem}
#stage{width:320px}.panel button{margin:.25rem}</style></head><body>
<div id="stage" class="sprite-breathe"></div>
<div class="panel">
  <button id="m0">Mouth closed</button><button id="m1">Mouth half</button><button id="m2">Mouth open</button>
  <button id="blink">Blink</button><button id="idle">Idle on/off</button>
  <br>
  <input type="file" id="audiofile" accept="audio/*"><button id="playfile">Play file (mouth follows)</button>
</div>
<script type="module">
  import { SpritePlayer } from "./js/sprite.js";
  import { MouthDriver } from "./js/audio-mouth.js";
  // 與 index.html 同源：有 config.json（私人 overlay）就用真角色資產，沒有就回範例臉。
  let assetsPath = "assets/sample/";
  try {
    const res = await fetch("config.json");
    if (res.ok) {
      const cfg = await res.json();
      if (cfg && typeof cfg.assetsPath === "string" && cfg.assetsPath) assetsPath = cfg.assetsPath;
    }
  } catch { /* 無 overlay ＝ 開源預設範例臉 */ }
  const p = new SpritePlayer(document.getElementById("stage"), { assetsPath });
  await p.load();
  let idling = false;
  m0.onclick = () => p.setMouth(0); m1.onclick = () => p.setMouth(1); m2.onclick = () => p.setMouth(2);
  blink.onclick = () => p._blinkNow();
  idle.onclick = () => { idling ? p.stopIdle() : p.startIdle(); idling = !idling; };

  // 播檔案動嘴：選本機任一音檔 → driver.attach() 掛上播放元件 → 播放事件開合嘴、
  // 結束回閉嘴。本頁不送嘴型譜（setEnvelope），driver 走 flap 有機拍嘴那條退路
  //（手動驗證用；真機瀏覽器人眼親驗，非本檔自動測試範圍）。
  const driver = new MouthDriver(p);
  document.addEventListener("pointerdown", () => driver.unlock(), { once: true });
  playfile.onclick = () => {
    const file = audiofile.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const audio = new Audio(url);
    driver.attach(audio);
    audio.onended = audio.onerror = () => { driver.detach(); URL.revokeObjectURL(url); };
    audio.play().catch((e) => console.error("demo play() rejected:", e));
  };
</script></body></html>
